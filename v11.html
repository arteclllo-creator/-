<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Книги</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <style>
        :root {
            --bg-main: #0F0F11;
            --bg-surface: #17171C;
            --bg-surface-elevated: #22222A;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --accent: #FF4A22; /* Фирменный коралловый цвет */
            --accent-tap: #E03D1A;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-speed: 0.25s;
        }

        [data-theme="light"] {
            --bg-main: #F2F2F7;
            --bg-surface: #FFFFFF;
            --bg-surface-elevated: #E5E5EA;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-main);
            color: var(--text-primary);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .view {
            display: none;
            min-height: 100vh;
            padding: 16px;
            position: relative;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        /* Шапка приложения */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:active {
            background: var(--bg-surface-elevated);
        }

        /* Полка книг (Сетка) */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 24px 16px;
        }

        .book-card {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .book-cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 145%;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--bg-surface);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .book-card:active .book-cover-wrapper {
            transform: scale(0.96);
        }

        .book-cover-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(135deg, #2C2C35, #17171C);
        }

        .book-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            margin-top: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 36px;
        }

        .book-author {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Экран карточки книги с размытием */
        #book-view {
            padding: 0;
        }

        .blur-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            filter: blur(35px) brightness(0.35);
            transform: scale(1.15);
        }

        [data-theme="light"] .blur-background {
            filter: blur(35px) brightness(0.9);
        }

        .detail-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-grow: 1;
            background: linear-gradient(to bottom, rgba(15,15,17,0.2) 0%, var(--bg-main) 65%);
            min-height: 100vh;
        }

        .detail-cover {
            width: 165px;
            height: 240px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 16px 32px rgba(0,0,0,0.5);
            margin-bottom: 24px;
            margin-top: 20px;
        }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            padding: 0 10px;
        }

        .detail-author {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .detail-description {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-primary);
            text-align: left;
            background: rgba(255,255,255,0.06);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 32px;
            width: 100%;
            max-height: 160px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        [data-theme="light"] .detail-description {
            background: rgba(0,0,0,0.04);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: auto;
            padding-bottom: 24px;
        }

        .btn-action {
            flex: 1;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-listen {
            background-color: var(--accent);
            color: #FFFFFF;
        }

        .btn-listen:active {
            background-color: var(--accent-tap);
        }

        .btn-read {
            background-color: var(--bg-surface-elevated);
            color: var(--text-primary);
        }

        /* Выделенный Аудиоплеер */
        .player-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: space-between;
            height: calc(100vh - 80px);
            width: 100%;
        }

        .player-cover {
            width: 240px;
            height: 240px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin: auto 0;
        }

        .player-info {
            width: 100%;
            margin-bottom: 28px;
        }

        .player-track-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }

        .player-book-title {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .player-controls-wrapper {
            width: 100%;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 24px;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: var(--bg-surface-elevated);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .slider::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .control-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 8px;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 22px;
            cursor: pointer;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-control:active {
            background: var(--bg-surface-elevated);
        }

        .btn-control.main-play {
            font-size: 52px;
            color: var(--accent);
            padding: 0;
        }

        .btn-control.main-play:active {
            background: none;
            transform: scale(0.95);
        }

        .speed-badge {
            font-size: 13px;
            font-weight: 600;
            background-color: var(--bg-surface-elevated);
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            margin-top: 20px;
        }

        /* Читалка ePub */
        #reader-view {
            padding: 0;
            background: var(--bg-surface);
        }

        .reader-header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: var(--bg-main);
            border-bottom: 1px solid var(--bg-surface-elevated);
            height: 56px;
        }

        #reader-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 112px);
            background-color: var(--bg-surface);
        }

        .reader-footer {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-main);
            border-top: 1px solid var(--bg-surface-elevated);
            height: 56px;
        }

        /* Настройки и Авторизация */
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-item {
            background-color: var(--bg-surface);
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-settings-action {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
        }

        .btn-danger {
            background-color: rgba(255, 74, 34, 0.15);
            color: #FF4A22;
        }

        .auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            text-align: center;
        }

        .auth-input {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--bg-surface-elevated);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
        }

        /* Глобальный Индикатор Загрузки */
        .loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            font-size: 14px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.85);
            padding: 14px 28px;
            border-radius: 24px;
            color: #FFFFFF;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body data-theme="dark">

    <div class="loader" id="global-loader">Загрузка...</div>

    <div id="auth-view" class="view">
        <div class="auth-container">
            <h2 style="margin-bottom: 12px; font-weight: 700;">Яндекс Книги</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 14px;">Введите OAuth-токен вашего Яндекс Диска</p>
            <input type="password" id="token-input" class="auth-input" placeholder="Токен доступа">
            <button class="btn-action btn-listen" style="max-width: 320px;" onclick="saveToken()">Войти</button>
        </div>
    </div>

    <div id="main-view" class="view">
        <div class="header">
            <h1>Книги</h1>
            <button class="icon-btn" onclick="switchView('settings-view')">⚙️</button>
        </div>
        <div class="books-grid" id="books-grid"></div>
    </div>

    <div id="settings-view" class="view">
        <div class="header">
            <button class="icon-btn" onclick="switchView('main-view')">←</button>
            <h1 style="font-size: 20px; flex-grow: 1; text-align: center; margin-right: 44px;">Настройки</h1>
        </div>
        <div class="settings-list">
            <div class="settings-item">
                <span>Темная тема</span>
                <input type="checkbox" id="theme-toggle" style="width: 20px; height: 20px; accent-color: var(--accent);" checked onchange="toggleTheme()">
            </div>
            <button class="btn-settings-action btn-read" onclick="clearAppCache()">🔄 Обновить полку (Сбросить кэш)</button>
            <button class="btn-settings-action btn-danger" onclick="logout()">🚪 Выйти из аккаунта</button>
        </div>
    </div>

    <div id="book-view" class="view">
        <div class="blur-background" id="detail-blur-bg"></div>
        <div class="detail-content">
            <div class="detail-header">
                <button class="icon-btn" onclick="switchView('main-view')">←</button>
            </div>
            <img class="detail-cover" id="detail-cover-img" src="" alt="">
            <div class="detail-title" id="detail-title-text">Название книги</div>
            <div class="detail-author" id="detail-author-text">Автор</div>
            <div class="detail-description" id="detail-desc-text">Описание загружается...</div>
            
            <div class="action-buttons">
                <button class="btn-action btn-listen" onclick="routeToAudio()"><span style="font-size: 18px;">🎧</span> Слушать</button>
                <button class="btn-action btn-read" onclick="routeToReader()"><span style="font-size: 18px;">📖</span> Читать</button>
            </div>
        </div>
    </div>

    <div id="player-view" class="view">
        <div class="header" style="margin-bottom: 0;">
            <button class="icon-btn" onclick="switchView('book-view')">←</button>
            <h1 style="font-size: 18px; flex-grow: 1; text-align: center; margin-right: 44px;">Плеер</h1>
        </div>
        <div class="player-container">
            <img class="player-cover" id="player-cover-img" src="" alt="">
            <div class="player-info">
                <div class="player-track-title" id="player-track-title">Название главы</div>
                <div class="player-book-title" id="player-book-title">Название книги</div>
            </div>
            <div class="player-controls-wrapper">
                <div class="progress-container">
                    <input type="range" class="slider" id="player-slider" value="0" min="0" max="100" oninput="seekAudio(this.value)">
                    <div class="time-info">
                        <span id="player-current-time">0:00</span>
                        <span id="player-total-time">0:00</span>
                    </div>
                </div>
                <div class="control-buttons">
                    <button class="btn-control" onclick="playPreviousTrack()">⏮</button>
                    <button class="btn-control" onclick="rewindAudio(-15)">-15с</button>
                    <button class="btn-control main-play" id="player-play-btn" onclick="togglePlay()">▶</button>
                    <button class="btn-control" onclick="rewindAudio(30)">+30с</button>
                    <button class="btn-control" onclick="playNextTrack()">⏭</button>
                </div>
                <button class="speed-badge" id="player-speed-btn" onclick="cyclePlaybackSpeed()">1.0x</button>
            </div>
        </div>
    </div>

    <div id="reader-view" class="view">
        <div class="reader-header">
            <button class="icon-btn" onclick="switchView('book-view')">←</button>
            <h1 style="font-size: 18px; flex-grow: 1; text-align: center; margin-right: 44px;" id="reader-book-title">Читалка</h1>
        </div>
        <div id="reader-container"></div>
        <div class="reader-footer">
            <button class="btn-action btn-read" style="padding: 10px;" onclick="window.currentRendition?.prev()">◀ Назад</button>
            <button class="btn-action btn-read" style="padding: 10px;" onclick="window.currentRendition?.next()">Вперед ▶</button>
        </div>
    </div>

    <script>
        // Глобальное состояние SPA
        const state = {
            token: localStorage.getItem('yd_token') || '',
            currentView: 'auth-view',
            selectedBook: '',
            currentPlaylist: [],
            currentTrackIndex: 0,
            playbackSpeed: 1.0,
            playingBookName: '',
            playingTrack: null,
            theme: localStorage.getItem('yd_theme') || 'dark'
        };

        // Единый фоновый аудиоплеер
        const audioPlayer = new Audio();

        // Инициализация при запуске
        window.addEventListener('DOMContentLoaded', () => {
            applyThemeUI();
            if (state.token) {
                switchView('main-view');
                loadBookshelf();
            } else {
                switchView('auth-view');
            }
            initAudioEventListeners();
        });

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            state.currentView = viewId;
            if (viewId === 'player-view') updatePlayerUI();
        }

        function showLoading(show) {
            document.getElementById('global-loader').style.display = show ? 'block' : 'none';
        }

        // РАБОТА С API ЯНДЕКС ДИСКА
        async function apiRequest(endpoint, params = {}) {
            const url = new URL('https://cloud-api.yandex.net/v1/disk/' + endpoint);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
            
            const response = await fetch(url, {
                headers: { 'Authorization': 'OAuth ' + state.token }
            });

            if (response.status === 401) {
                alert('Ошибка авторизации. Проверьте ваш OAuth-токен.');
                logout();
                throw new Error('Unauthorized');
            }
            return response.json();
        }

        function saveToken() {
            const val = document.getElementById('token-input').value.trim();
            if (val) {
                state.token = val;
                localStorage.setItem('yd_token', val);
                switchView('main-view');
                loadBookshelf();
            }
        }

        function logout() {
            localStorage.removeItem('yd_token');
            state.token = '';
            switchView('auth-view');
        }

        // СТРАТЕГИЯ СМАРТ-КЭШИРОВАНИЯ
        function getCache(key) {
            const item = localStorage.getItem('book_cache_' + key);
            return item ? JSON.parse(item) : null;
        }

        function setCache(key, data) {
            localStorage.setItem('book_cache_' + key, JSON.stringify(data));
        }

        function clearAppCache() {
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('book_cache_')) localStorage.removeItem(key);
            });
            alert('Кэш метаданных очищен.');
            loadBookshelf();
        }

        // ЗАГРУЗКА ДАННЫХ КАТАЛОГА (Книжная полка)
        async function loadBookshelf() {
            showLoading(true);
            try {
                // Список папок запрашивается всегда в реальном времени
                const data = await apiRequest('resources', { path: '01. Медиатека/Книги', limit: 100 });
                const folders = data._embedded?.items.filter(item => item.type === 'dir') || [];
                
                const grid = document.getElementById('books-grid');
                grid.innerHTML = '';

                for (const folder of folders) {
                    const bookName = folder.name;
                    const cachedMeta = getCache(bookName);

                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.onclick = () => openBookDetails(bookName);

                    // Генерация безопасного ID для динамического обновления DOM
                    const safeId = "cover-" + btoa(unescape(encodeURIComponent(bookName))).replace(/=/g, '');

                    card.innerHTML = `
                        <div class="book-cover-wrapper" id="${safeId}">
                            ${cachedMeta && cachedMeta.coverUrl ? `<img src="${cachedMeta.coverUrl}">` : `<div class="no-cover">📖</div>`}
                        </div>
                        <div class="book-title">${bookName}</div>
                        <div class="book-author">${cachedMeta ? cachedMeta.author : 'Загрузка...'}</div>
                    `;
                    grid.appendChild(card);

                    // Если тяжелых ресурсов нет в кэше — фоново подтягиваем их по сети один раз
                    if (!cachedMeta) {
                        fetchBookMetaInBackground(bookName, safeId);
                    }
                }
            } catch (e) {
                console.error('Ошибка рендеринга полки:', e);
            } finally {
                showLoading(false);
            }
        }

        // ФОНОВЫЙ СБОР МЕТАДАННЫХ КОНКРЕТНОЙ КНИГИ
        async function fetchBookMetaInBackground(bookName, elementId) {
            try {
                const res = await apiRequest('resources', { path: `01. Медиатека/Книги/${bookName}`, limit: 100 });
                const items = res._embedded?.items || [];

                let coverFile = items.find(i => i.name.toLowerCase() === 'cover.jpg' || i.name.toLowerCase() === 'cover.png');
                let infoFile = items.find(i => i.name.toLowerCase() === 'info.json');
                let epubFile = items.find(i => i.name.toLowerCase().endsWith('.epub'));

                let coverUrl = '';
                let author = 'Автор не указан';
                let description = 'Описание отсутствует.';
                let epubPath = epubFile ? epubFile.path : '';

                if (coverFile) {
                    const d = await apiRequest('resources/download', { path: coverFile.path });
                    coverUrl = d.href;
                }

                if (infoFile) {
                    const d = await apiRequest('resources/download', { path: infoFile.path });
                    const infoRes = await fetch(d.href);
                    const infoJson = await infoRes.json();
                    author = infoJson.author || infoJson.Author || author;
                    description = infoJson.description || infoJson.Description || description;
                }

                const metaToCache = { coverUrl, author, description, epubPath };
                setCache(bookName, metaToCache);

                // Бесшовное обновление элемента на главной витрине
                const wrapper = document.getElementById(elementId);
                if (wrapper) {
                    if (coverUrl) wrapper.innerHTML = `<img src="${coverUrl}">`;
                    wrapper.nextElementSibling.nextElementSibling.textContent = author;
                }
            } catch (e) {
                console.error('Ошибка фонового сбора метаданных для ' + bookName, e);
            }
        }

        // СТРАНИЦА КАРТОЧКИ КНИГИ
        function openBookDetails(bookName) {
            state.selectedBook = bookName;
            const cachedMeta = getCache(bookName);

            const blurBg = document.getElementById('detail-blur-bg');
            const coverImg = document.getElementById('detail-cover-img');
            const titleText = document.getElementById('detail-title-text');
            const authorText = document.getElementById('detail-author-text');
            const descText = document.getElementById('detail-desc-text');

            titleText.textContent = bookName;

            if (cachedMeta) {
                blurBg.style.backgroundImage = `url('${cachedMeta.coverUrl}')`;
                coverImg.src = cachedMeta.coverUrl;
                authorText.textContent = cachedMeta.author;
                descText.textContent = cachedMeta.description;
            } else {
                blurBg.style.backgroundImage = 'none';
                coverImg.src = '';
                authorText.textContent = 'Загрузка...';
                descText.textContent = 'Подгружаем метаданные из сети...';
            }

            switchView('book-view');
        }

        // МАРШРУТИЗАЦИЯ НА ОДДЕЛЬНЫЙ ЭКРАН АУДИОПЛЕЕРА
        async function routeToAudio() {
            const bookName = state.selectedBook;
            switchView('player-view');
            document.getElementById('player-book-title').textContent = bookName;

            const cachedMeta = getCache(bookName);
            document.getElementById('player-cover-img').src = cachedMeta ? cachedMeta.coverUrl : '';

            showLoading(true);
            try {
                // Аудиофайлы запрашиваются исключительно из строго заданной внутренней директории /Аудиокнига
                const res = await apiRequest('resources', { path: `01. Медиатека/Книги/${bookName}/Аудиокнига`, limit: 100 });
                let tracks = res._embedded?.items.filter(i => i.name.toLowerCase().endsWith('.mp3')) || [];
                
                // Сортировка глав по естественному алфавитно-цифровому порядку
                tracks.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

                if (tracks.length === 0) {
                    alert('Файлы .mp3 в папке "Аудиокнига" не обнаружены.');
                    switchView('book-view');
                    return;
                }

                state.currentPlaylist = tracks;

                // Переинициализируем плеер только если переключились на новую книгу
                if (state.playingBookName !== bookName) {
                    state.playingBookName = bookName;
                    state.currentTrackIndex = 0;
                    await loadTrack(0);
                } else {
                    updatePlayerUI();
                }
            } catch (e) {
                console.error(e);
                alert('Не удалось подтянуть аудио-плейлист.');
                switchView('book-view');
            } finally {
                showLoading(false);
            }
        }

        // ЛОГИКА ВОСПРОИЗВЕДЕНИЯ АУДИО
        async function loadTrack(index) {
            if (!state.currentPlaylist || !state.currentPlaylist[index]) return;
            const track = state.currentPlaylist[index];
            document.getElementById('player-track-title').textContent = track.name.replace('.mp3', '');
            
            showLoading(true);
            try {
                const d = await apiRequest('resources/download', { path: track.path });
                audioPlayer.src = d.href; // Временная прямая сессионная ссылка
                audioPlayer.playbackRate = state.playbackSpeed;
                audioPlayer.play();
                state.playingTrack = track;
                document.getElementById('player-play-btn').textContent = '⏸';
            } catch (e) {
                console.error(e);
                alert('Не удалось запустить аудиопоток.');
            } finally {
                showLoading(false);
            }
        }

        function initAudioEventListeners() {
            audioPlayer.addEventListener('timeupdate', () => {
                const slider = document.getElementById('player-slider');
                const currentEl = document.getElementById('player-current-time');
                const totalEl = document.getElementById('player-total-time');

                if (!isNaN(audioPlayer.duration)) {
                    slider.max = Math.floor(audioPlayer.duration);
                    slider.value = Math.floor(audioPlayer.currentTime);
                    totalEl.textContent = formatTime(audioPlayer.duration);
                }
                currentEl.textContent = formatTime(audioPlayer.currentTime);
            });

            audioPlayer.addEventListener('ended', () => {
                playNextTrack();
            });
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function togglePlay() {
            if (!state.playingTrack) return;
            if (audioPlayer.paused) {
                audioPlayer.play();
                document.getElementById('player-play-btn').textContent = '⏸';
            } else {
                audioPlayer.pause();
                document.getElementById('player-play-btn').textContent = '▶';
            }
        }

        function seekAudio(value) {
            audioPlayer.currentTime = value;
        }

        function rewindAudio(seconds) {
            audioPlayer.currentTime += seconds;
        }

        function playNextTrack() {
            if (state.currentPlaylist && state.currentTrackIndex < state.currentPlaylist.length - 1) {
                state.currentTrackIndex++;
                loadTrack(state.currentTrackIndex);
            }
        }

        function playPreviousTrack() {
            if (state.currentPlaylist && state.currentTrackIndex > 0) {
                state.currentTrackIndex--;
                loadTrack(state.currentTrackIndex);
            }
        }

        function cyclePlaybackSpeed() {
            const speeds = [1.0, 1.25, 1.5, 1.75, 2.0];
            let idx = speeds.indexOf(state.playbackSpeed);
            idx = (idx + 1) % speeds.length;
            state.playbackSpeed = speeds[idx];
            audioPlayer.playbackRate = state.playbackSpeed;
            document.getElementById('player-speed-btn').textContent = state.playbackSpeed + 'x';
        }

        function updatePlayerUI() {
            if (state.playingTrack && state.playingBookName === state.selectedBook) {
                document.getElementById('player-track-title').textContent = state.playingTrack.name.replace('.mp3', '');
                document.getElementById('player-play-btn').textContent = audioPlayer.paused ? '▶' : '⏸';
                document.getElementById('player-speed-btn').textContent = state.playbackSpeed + 'x';
            } else {
                document.getElementById('player-track-title').textContent = 'Нажмите Play для воспроизведения';
                document.getElementById('player-play-btn').textContent = '▶';
            }
        }

        // МАРШРУТИЗАЦИЯ НА ОТДЕЛЬНЫЙ ЭКРАН ЧИТАЛКИ (ePub.js)
        async function routeToReader() {
            const bookName = state.selectedBook;
            const cachedMeta = getCache(bookName);

            if (!cachedMeta || !cachedMeta.epubPath) {
                alert('В корневом каталоге книги файл формата .epub не найден.');
                return;
            }

            switchView('reader-view');
            document.getElementById('reader-book-title').textContent = bookName;
            document.getElementById('reader-container').innerHTML = '';

            showLoading(true);
            try {
                const d = await apiRequest('resources/download', { path: cachedMeta.epubPath });
                const blobRes = await fetch(d.href);
                const epubBlob = await blobRes.blob(); // Скачивание книги бинарным Blob-объектом

                if (window.currentEpubBook) {
                    window.currentEpubBook.destroy();
                }

                // Инициализация библиотеки ePub.js
                const book = ePub(epubBlob);
                window.currentEpubBook = book;
                
                const rendition = book.renderTo("reader-container", {
                    width: "100%",
                    height: "100%",
                    spread: "none"
                });
                window.currentRendition = rendition;
                
                // Кастомизация темы отображения текста под выбранную системную тему приложения
                if (state.theme === 'dark') {
                    rendition.themes.register('custom', { 'body': { 'background': '#17171C !important', 'color': '#FFFFFF !important' } });
                } else {
                    rendition.themes.register('custom', { 'body': { 'background': '#FFFFFF !important', 'color': '#1C1C1E !important' } });
                }
                
                rendition.display();
                rendition.themes.select('custom');

            } catch (e) {
                console.error(e);
                alert('Критическая ошибка парсинга ePub-файла.');
                switchView('book-view');
            } finally {
                showLoading(false);
            }
        }

        // СМЕНА СТИЛИСТИЧЕСКИХ ТЕМИНГОВ (Светлая/Темная)
        function toggleTheme() {
            state.theme = document.getElementById('theme-toggle').checked ? 'dark' : 'light';
            localStorage.setItem('yd_theme', state.theme);
            applyThemeUI();
        }

        function applyThemeUI() {
            document.body.setAttribute('data-theme', state.theme);
            const toggle = document.getElementById('theme-toggle');
            if (toggle) toggle.checked = (state.theme === 'dark');
        }
    </script>
</body>
</html>
