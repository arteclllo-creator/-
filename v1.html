<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книги</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #fc3f1d; /* Фирменный кораллово-красный Яндекса */
            --input-bg: #2a2a2a;
            --border-color: #2c2c2e;
            --glass-bg: rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #121212;
            --text-secondary: #666666;
            --accent-color: #fc3f1d;
            --input-bg: #e5e5e7;
            --border-color: #e5e5ea;
            --glass-bg: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
            z-index: 1;
        }

        .screen.hidden {
            display: none !important;
            z-index: 0;
        }

        /* Шапка приложения */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .icon-btn:hover {
            background: var(--input-bg);
        }

        /* Экран авторизации */
        #auth-screen {
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .auth-container h2 { margin-bottom: 12px; }
        .auth-container p { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            margin-bottom: 16px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        /* Полка книг (Главный экран) */
        .shelf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .book-card:active { transform: scale(0.97); }

        .cover-wrapper {
            width: 100%;
            aspect-ratio: 2/3;
            background: #252528;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-info-mini {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .book-title-mini {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-author-mini {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Карточка книги */
        #book-screen {
            position: relative;
        }

        .blurred-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(35px) brightness(0.4);
            transform: scale(1.1);
            z-index: 1;
        }

        [data-theme="light"] .blurred-bg {
            filter: blur(35px) brightness(0.85);
        }

        .book-content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
        }

        .large-cover {
            width: 200px;
            aspect-ratio: 2/3;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            object-fit: cover;
            margin: 40px 0 24px 0;
        }

        .book-title-large {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            padding: 0 16px;
        }

        .book-author-large {
            font-size: 16px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 40px;
        }

        .action-buttons-container {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }

        .action-btn {
            flex: 1;
            padding: 16px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: filter 0.2s;
        }

        .action-btn:active { filter: brightness(0.9); }

        .btn-listen {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-read {
            background: #ffffff;
            color: #000000;
        }
        [data-theme="dark"] .btn-read {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Экран аудиоплеера */
        .player-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .player-info {
            text-align: center;
            margin-top: 20px;
        }

        .player-controls {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 20px;
        }

        .timeline-container { width: 100%; }

        .timeline-slider {
            width: 100%;
            -webkit-appearance: none;
            background: var(--border-color);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .skip-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            gap: 4px;
        }

        .skip-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .speed-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .playlist-container {
            width: 100%;
            max-width: 360px;
            max-height: 180px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .track-item {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .track-item.active {
            color: var(--accent-color);
            background: rgba(252, 63, 29, 0.1);
            font-weight: 600;
        }

        /* Экран Читалки (EPUB) */
        .reader-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 70px);
        }

        #epub-viewer {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            padding: 8px;
        }

        .reader-nav {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        /* Экран Настроек */
        .settings-list { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .settings-item {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .toggle-switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        .loader {
            border: 3px solid var(--input-bg);
            border-radius: 50%;
            border-top: 3px solid var(--accent-color);
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .center-msg { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 14px; }
    </style>
</head>
<body>

    <audio id="global-audio" style="display:none;"></audio>

    <div id="auth-screen" class="screen">
        <div class="auth-container">
            <h2>Яндекс Медиатека</h2>
            <p>Введите ваш OAuth-токен Яндекс Диска для доступа к медиатеке</p>
            <input type="password" id="oauth-token-input" placeholder="OAuth Токен">
            <button class="btn" onclick="handleAuth()">Войти</button>
        </div>
    </div>

    <div id="main-screen" class="screen hidden">
        <header>
            <h1>Книги</h1>
            <button class="icon-btn" onclick="navigateTo('settings-screen')">⚙️</button>
        </header>
        <div id="shelf-loader" class="loader hidden"></div>
        <div id="shelf-error" class="center-msg hidden"></div>
        <div id="shelf-grid" class="shelf-grid"></div>
    </div>

    <div id="book-screen" class="screen hidden">
        <div id="book-blurred-bg" class="blurred-bg"></div>
        <div class="book-content-wrapper">
            <div class="book-details-header">
                <button class="icon-btn" onclick="navigateTo('main-screen')">←</button>
                <div style="width:40px;"></div>
            </div>
            <img id="book-large-cover" class="large-cover" src="" alt="Обложка">
            <h2 id="book-title" class="book-title-large"></h2>
            <p id="book-author" class="book-author-large"></p>
            
            <div class="action-buttons-container">
                <button class="action-btn btn-listen" onclick="openAudioPlayer()">🎧 Слушать</button>
                <button class="action-btn btn-read" onclick="openEpubReader()">📖 Читать</button>
            </div>
        </div>
    </div>

    <div id="player-screen" class="screen hidden">
        <header>
            <button class="icon-btn" onclick="navigateTo('book-screen')">←</button>
            <h1 id="player-header-title">Плеер</h1>
            <div style="width:40px;"></div>
        </header>
        <div class="player-body">
            <div class="player-info">
                <h2 id="player-book-title" style="font-size:20px; margin-bottom:6px;">Название книги</h2>
                <p id="player-track-title" style="color:var(--text-secondary); font-size:14px;">Глава 1</p>
            </div>

            <div class="player-controls">
                <div class="timeline-container">
                    <input type="range" id="timeline" class="timeline-slider" min="0" value="0" step="1" oninput="seekAudio(this.value)">
                    <div class="time-info">
                        <span id="time-current">0:00</span>
                        <span id="time-duration">0:00</span>
                    </div>
                </div>

                <div class="control-row">
                    <button class="skip-btn" onclick="skipTime(-15)">
                        <svg viewBox="0 0 24 24"><path d="M12.5 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.31 2.69-6 6-6s6 2.69 6 6-2.69 6-6 6c-1.66 0-3.17-.67-4.28-1.76L6.29 17.77C7.74 19.16 9.77 20 12.5 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1.5 6v6h2v-6h-2z"/></svg>
                        -15с
                    </button>
                    <button id="play-pause-btn" class="play-btn" onclick="togglePlay()">▶</button>
                    <button class="skip-btn" onclick="skipTime(30)">
                        <svg viewBox="0 0 24 24"><path d="M11.5 3c4.97 0 9 4.03 9 9h2.5L19.11 15.89l-.07.14L15 12h3c0-3.31-2.69-6-6-6s-6 2.69-6 6 2.69 6 6 6c1.66 0 3.17-.67 4.28-1.76l1.43 1.43C16.26 19.16 14.23 20 11.5 20c-4.97 0-9-4.03-9-9s4.03-9 9-9zm1.5 6v6h-2v-6h2z"/></svg>
                        +30с
                    </button>
                </div>

                <div style="display:flex; justify-content:center;">
                    <button id="speed-btn" class="speed-btn" onclick="cycleSpeed()">1.0x</button>
                </div>
            </div>

            <div class="playlist-container">
                <div style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; padding-left:12px;">СПИСОК ГЛАВ</div>
                <div id="tracks-list"></div>
            </div>
        </div>
    </div>

    <div id="reader-screen" class="screen hidden">
        <header>
            <button class="icon-btn" onclick="navigateTo('book-screen')">←</button>
            <h1 id="reader-header-title">Читалка</h1>
            <div style="width:40px;"></div>
        </header>
        <div class="reader-body">
            <div id="reader-loader" class="loader hidden"></div>
            <div id="reader-error" class="center-msg hidden"></div>
            <div id="epub-viewer"></div>
            <div class="reader-nav">
                <button class="nav-btn" onclick="epubRendition?.prev()">Назад</button>
                <button class="nav-btn" onclick="epubRendition?.next()">Вперед</button>
            </div>
        </div>
    </div>

    <div id="settings-screen" class="screen hidden">
        <header>
            <button class="icon-btn" onclick="navigateTo('main-screen')">←</button>
            <h1>Настройки</h1>
            <div style="width:40px;"></div>
        </header>
        <div class="settings-list">
            <div class="settings-item">
                <span>Темная тема</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="theme-toggle" onchange="toggleTheme(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <button class="btn" style="background:#252528; color:#fff;" onclick="clearBookCache()">Обновить полку</button>
            <button class="btn" style="margin-top:20px;" onclick="handleLogout()">Выйти из аккаунта</button>
        </div>
    </div>

    <script>
        const BASE_PATH = '01. Медиатека/Книги';
        let token = '';
        let currentBookFolder = '';
        let currentPlaylist = [];
        let currentTrackIndex = 0;
        let playbackSpeeds = [1.0, 1.25, 1.5, 1.75, 2.0];
        let currentSpeedIndex = 0;

        // Переменные для ePub.js
        let epubBook = null;
        let epubRendition = null;

        const audioPlayer = document.getElementById('global-audio');

        // Инициализация при старте
        window.addEventListener('DOMContentLoaded', () => {
            token = localStorage.getItem('yd_token');
            const savedTheme = localStorage.getItem('app_theme') || 'dark';
            
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-toggle').checked = (savedTheme === 'dark');

            if (token) {
                navigateTo('main-screen');
                loadShelf();
            } else {
                navigateTo('auth-screen');
            }
            setupAudioListeners();
        });

        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function handleAuth() {
            const inputToken = document.getElementById('oauth-token-input').value.trim();
            if (inputToken) {
                localStorage.setItem('yd_token', inputToken);
                token = inputToken;
                navigateTo('main-screen');
                loadShelf();
            }
        }

        function handleLogout() {
            localStorage.removeItem('yd_token');
            token = '';
            navigateTo('auth-screen');
        }

        function toggleTheme(isDark) {
            const theme = isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
        }

        function clearBookCache() {
            // Очищаем только закэшированные метаданные книг
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('book_cache_')) localStorage.removeItem(key);
            });
            alert('Кэш очищен. Полка будет обновлена.');
            loadShelf();
            navigateTo('main-screen');
        }

        // Загрузка главной полки (всегда в реальном времени с API)
        async function loadShelf() {
            const grid = document.getElementById('shelf-grid');
            const loader = document.getElementById('shelf-loader');
            const errorDiv = document.getElementById('shelf-error');

            grid.innerHTML = '';
            loader.classList.remove('hidden');
            errorDiv.classList.add('hidden');

            try {
                const url = `https://cloud-api.yandex.net/v1/disk/resources?path=${encodeURIComponent(BASE_PATH)}&limit=100`;
                const res = await fetch(url, { headers: { 'Authorization': `OAuth ${token}` } });
                
                if (!res.ok) throw new Error('Ошибка доступа к Яндекс Диску. Проверьте токен.');
                const data = await res.json();
                
                const folders = data._embedded?.items.filter(item => item.type === 'dir') || [];
                
                if (folders.length === 0) {
                    errorDiv.innerText = 'В папке 01. Медиатека/Книги/ нет подпапок с книгами.';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                folders.forEach(folder => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.innerHTML = `
                        <div class="cover-wrapper" id="cover-wrap-${btoa(encodeURIComponent(folder.name))}">
                            <span style="font-size:24px;">📘</span>
                        </div>
                        <div class="book-info-mini">
                            <div class="book-title-mini">${folder.name}</div>
                            <div class="book-author-mini" id="author-mini-${btoa(encodeURIComponent(folder.name))}">Загрузка...</div>
                        </div>
                    `;
                    card.onclick = () => openBookCard(folder.name);
                    grid.appendChild(card);

                    // Параллельный фоновый запрос метаданных книги с использованием сквозного умного кэша
                    lazyLoadBookMeta(folder.name);
                });

            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        }

        // Сквозная логика работы с кэшем тяжелых ресурсов
        async function lazyLoadBookMeta(folderName) {
            const cacheKey = `book_cache_${folderName}`;
            let cachedData = localStorage.getItem(cacheKey);

            if (cachedData) {
                const book = JSON.parse(cachedData);
                updateMiniCardUI(folderName, book.author, book.coverUrl);
                return book;
            }

            // Если в кэше нет, то аккуратно заглядываем внутрь папки на Диске
            try {
                const path = `${BASE_PATH}/${folderName}`;
                const url = `https://cloud-api.yandex.net/v1/disk/resources?path=${encodeURIComponent(path)}&limit=50`;
                const res = await fetch(url, { headers: { 'Authorization': `OAuth ${token}` } });
                if (!res.ok) return null;
                const data = await res.json();
                const files = data._embedded?.items || [];

                let author = 'Автор не указан';
                let coverUrl = '';
                let epubPath = '';

                // 1. Ищем info.json
                const infoFile = files.find(f => f.name.toLowerCase() === 'info.json');
                if (infoFile) {
                    const dUrlRes = await fetch(`https://cloud-api.yandex.net/v1/disk/resources/download?path=${encodeURIComponent(infoFile.path)}`, { headers: { 'Authorization': `OAuth ${token}` } });
                    if (dUrlRes.ok) {
                        const dUrlData = await dUrlRes.json();
                        const infoContent = await fetch(dUrlData.href).then(r => r.json());
                        if (infoContent.author) author = infoContent.author;
                    }
                }

                // 2. Ищем обложку cover.jpg или cover.png
                const coverFile = files.find(f => f.name.toLowerCase() === 'cover.jpg' || f.name.toLowerCase() === 'cover.png');
                if (coverFile) {
                    const dUrlRes = await fetch(`https://cloud-api.yandex.net/v1/disk/resources/download?path=${encodeURIComponent(coverFile.path)}`, { headers: { 'Authorization': `OAuth ${token}` } });
                    if (dUrlRes.ok) {
                        const dUrlData = await dUrlRes.json();
                        coverUrl = dUrlData.href; // Прямая временная ссылка на обложку
                    }
                }

                // 3. Запоминаем путь к файлу .epub для читалки
                const epubFile = files.find(f => f.name.toLowerCase().endsWith('.epub'));
                if (epubFile) {
                    epubPath = epubFile.path;
                }

                const metaToCache = { author, coverUrl, epubPath };
                localStorage.setItem(cacheKey, JSON.stringify(metaToCache));
                
                updateMiniCardUI(folderName, author, coverUrl);
                return metaToCache;

            } catch (e) {
                console.error('Ошибка фонового разбора папки:', e);
                return null;
            }
        }

        function updateMiniCardUI(folderName, author, coverUrl) {
            const safeId = btoa(encodeURIComponent(folderName));
            const authorDiv = document.getElementById(`author-mini-${safeId}`);
            const wrapDiv = document.getElementById(`cover-wrap-${safeId}`);
            
            if (authorDiv) authorDiv.innerText = author;
            if (wrapDiv && coverUrl) {
                wrapDiv.innerHTML = `<img class="cover-img" src="${coverUrl}" alt="Обложка">`;
            }
        }

        // Открытие карточки книги (данные берутся мгновенно из кэша)
        async function openBookCard(folderName) {
            currentBookFolder = folderName;
            navigateTo('book-screen');

            // Заполняем базовые параметры заглушками
            document.getElementById('book-title').innerText = folderName;
            document.getElementById('book-author').innerText = 'Загрузка...';
            document.getElementById('book-large-cover').src = '';
            document.getElementById('book-blurred-bg').style.backgroundImage = 'none';

            // Моментально подтягиваем тяжелые ресурсы из кэша
            const book = await lazyLoadBookMeta(folderName);
            if (book) {
                document.getElementById('book-author').innerText = book.author;
                if (book.coverUrl) {
                    document.getElementById('book-large-cover').src = book.coverUrl;
                    document.getElementById('book-blurred-bg').style.backgroundImage = `url('${book.coverUrl}')`;
                }
            }
        }

        // ПЛЕЕР: Получение списка аудиофайлов и открытие экрана плеера
        async function openAudioPlayer() {
            navigateTo('player-screen');
            document.getElementById('player-book-title').innerText = currentBookFolder;
            document.getElementById('player-track-title').innerText = 'Сканирование аудиоглав...';
            const trackListDiv = document.getElementById('tracks-list');
            trackListDiv.innerHTML = '<div class="center-msg">Поиск файлов в папке "Аудиокнига"...</div>';

            try {
                // Аудиофайлы .mp3 запрашиваются из папки "Аудиокнига" в реальном времени
                const audioPath = `${BASE_PATH}/${currentBookFolder}/Аудиокнига`;
                const url = `https://cloud-api.yandex.net/v1/disk/resources?path=${encodeURIComponent(audioPath)}&limit=100&sort=name`;
                const res = await fetch(url, { headers: { 'Authorization': `OAuth ${token}` } });
                
                if (!res.ok) throw new Error('Папка "Аудиокнига" не найдена или пуста.');
                const data = await res.json();
                
                const mp3Files = data._embedded?.items.filter(f => f.name.toLowerCase().endsWith('.mp3')) || [];
                
                if (mp3Files.length === 0) {
                    trackListDiv.innerHTML = '<div class="center-msg">Внутри папки "Аудиокнига" отсутствуют файлы .mp3</div>';
                    return;
                }

                currentPlaylist = mp3Files;
                renderPlaylist();

                // Автоматически запускаем первую главу, если сейчас ничего не играет или запущена другая книга
                if (audioPlayer.paused || !audioPlayer.src.includes(encodeURIComponent(currentBookFolder))) {
                    playTrack(0);
                } else {
                    updatePlayerUI();
                }

            } catch (err) {
                trackListDiv.innerHTML = `<div class="center-msg" style="color:var(--accent-color);">${err.message}</div>`;
            }
        }

        function renderPlaylist() {
            const trackListDiv = document.getElementById('tracks-list');
            trackListDiv.innerHTML = '';
            
            currentPlaylist.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = `track-item ${index === currentTrackIndex ? 'active' : ''}`;
                item.innerHTML = `<span>${file.name.replace('.mp3', '')}</span>`;
                item.onclick = () => playTrack(index);
                trackListDiv.appendChild(item);
            });
        }

        async function playTrack(index) {
            if (index < 0 || index >= currentPlaylist.length) return;
            currentTrackIndex = index;
            
            document.getElementById('player-track-title').innerText = 'Получение ссылки...';
            renderPlaylist();

            try {
                const file = currentPlaylist[index];
                const dUrlRes = await fetch(`https://cloud-api.yandex.net/v1/disk/resources/download?path=${encodeURIComponent(file.path)}`, { headers: { 'Authorization': `OAuth ${token}` } });
                const dUrlData = await dUrlRes.json();
                
                audioPlayer.src = dUrlData.href;
                audioPlayer.playbackRate = playbackSpeeds[currentSpeedIndex];
                audioPlayer.play();
                
                updatePlayerUI();
            } catch (e) {
                document.getElementById('player-track-title').innerText = 'Ошибка загрузки трека';
            }
        }

        function updatePlayerUI() {
            if (!currentPlaylist[currentTrackIndex]) return;
            document.getElementById('player-track-title').innerText = currentPlaylist[currentTrackIndex].name.replace('.mp3', '');
            document.getElementById('play-pause-btn').innerText = audioPlayer.paused ? '▶' : '⏸';
        }

        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
            document.getElementById('play-pause-btn').innerText = audioPlayer.paused ? '▶' : '⏸';
        }

        function skipTime(seconds) {
            audioPlayer.currentTime = Math.max(0, Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + seconds));
        }

        function seekAudio(value) {
            audioPlayer.currentTime = value;
        }

        function cycleSpeed() {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            const newSpeed = playbackSpeeds[currentSpeedIndex];
            audioPlayer.playbackRate = newSpeed;
            document.getElementById('speed-btn').innerText = `${newSpeed.toFixed(2)}x`;
        }

        function setupAudioListeners() {
            audioPlayer.addEventListener('timeupdate', () => {
                const timeline = document.getElementById('timeline');
                const timeCurrent = document.getElementById('time-current');
                const timeDuration = document.getElementById('time-duration');
                
                if (!isNaN(audioPlayer.duration)) {
                    timeline.max = Math.floor(audioPlayer.duration);
                    timeline.value = Math.floor(audioPlayer.currentTime);
                    timeDuration.innerText = formatTime(audioPlayer.duration);
                }
                timeCurrent.innerText = formatTime(audioPlayer.currentTime);
            });

            audioPlayer.addEventListener('ended', () => {
                if (currentTrackIndex + 1 < currentPlaylist.length) {
                    playTrack(currentTrackIndex + 1);
                }
            });

            audioPlayer.addEventListener('play', updatePlayerUI);
            audioPlayer.addEventListener('pause', updatePlayerUI);
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }


        // ЧИТАЛКА: Загрузка бинарного .epub файла и инициализация ePub.js
        async function openEpubReader() {
            navigateTo('reader-screen');
            const viewer = document.getElementById('epub-viewer');
            const loader = document.getElementById('reader-loader');
            const errDiv = document.getElementById('reader-error');

            viewer.innerHTML = '';
            loader.classList.remove('hidden');
            errDiv.classList.add('hidden');

            try {
                const cacheKey = `book_cache_${currentBookFolder}`;
                const cachedData = JSON.parse(localStorage.getItem(cacheKey) || '{}');
                
                let epubPath = cachedData.epubPath;

                // Если пути к EPUB нет в кэше, выполняем быстрый поиск на Диске
                if (!epubPath) {
                    const path = `${BASE_PATH}/${currentBookFolder}`;
                    const res = await fetch(`https://cloud-api.yandex.net/v1/disk/resources?path=${encodeURIComponent(path)}&limit=40`, { headers: { 'Authorization': `OAuth ${token}` } });
                    const data = await res.json();
                    const epubFile = data._embedded?.items.find(f => f.name.toLowerCase().endsWith('.epub'));
                    if (!epubFile) throw new Error('Файл книги формата .epub в папке не найден.');
                    epubPath = epubFile.path;
                }

                // Шаг 1. Получаем прямую ссылку на скачивание файла
                const dUrlRes = await fetch(`https://cloud-api.yandex.net/v1/disk/resources/download?path=${encodeURIComponent(epubPath)}`, { headers: { 'Authorization': `OAuth ${token}` } });
                const dUrlData = await dUrlRes.json();

                // Шаг 2. Скачиваем файл как бинарный Blob объект для ePub.js
                const fileBlob = await fetch(dUrlData.href).then(r => r.blob());

                // Инициализация объекта книги через библиотеку ePub.js
                epubBook = ePub(fileBlob);
                epubRendition = epubBook.renderTo("epub-viewer", {
                    width: "100%",
                    height: "100%",
                    spread: "none"
                });

                // Применяем цветовую палитру читалки под текущую тему
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                epubRendition.themes.default({
                    'body': {
                        'background-color': isDark ? '#1e1e1e' : '#ffffff',
                        'color': isDark ? '#ffffff' : '#121212',
                        'padding': '0 10px !important'
                    }
                });

                epubRendition.display();
                loader.classList.add('hidden');

            } catch (err) {
                loader.classList.add('hidden');
                errDiv.innerText = err.message;
                errDiv.classList.remove('hidden');
            }
        }
    </script>
