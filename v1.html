<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Яндекс.Книги на Диске</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#121214">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --bg-color: #121214;
            --surface-color: #1e1e24;
            --accent-color: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --border-color: #2a2a32;
            --btn-dark: #26262b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Динамический размытый фон для страницы книги */
        .blur-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50vh;
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.4);
            transform: scale(1.2);
            z-index: -1;
            transition: background-image 0.5s ease;
            display: none;
        }

        body.detail-active .blur-background {
            display: block;
        }

        header {
            background-color: rgba(30, 30, 36, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .btn-settings {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
        }

        main {
            padding: 16px;
            padding-bottom: 140px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Настройки */
        .auth-card {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        button.btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Витрина Книг */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .book-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .book-card:active { transform: scale(0.98); }

        .cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 130%;
            background-color: #25252d;
        }

        .cover-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .cover-placeholder {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .book-info { padding: 10px; }
        .book-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-author { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Экран книги в стиле референса */
        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 13px;
            backdrop-filter: blur(10px);
        }

        .book-detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
        }

        .detail-cover {
            width: 220px;
            height: 220px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            background-color: var(--surface-color);
        }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            padding: 0 10px;
        }

        .detail-author {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Спаренный переключатель Читать / Слушать как на скриншоте */
        .mode-container-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 24px;
        }

        .mode-switcher-combined {
            display: flex;
            background-color: var(--btn-dark);
            border-radius: 26px;
            width: 100%;
            max-width: 340px;
            padding: 4px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .mode-btn-combined {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 2;
            transition: color 0.2s;
        }

        .mode-btn-combined.active {
            background-color: #38383e;
            color: #ffffff;
        }

        .mode-separator {
            width: 1px;
            background-color: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
        }

        /* Контентные блоки */
        .mode-content { display: none; }
        .mode-content.active { display: block; }

        .detail-desc {
            font-size: 14px;
            color: #e0e0e6;
            line-height: 1.6;
            margin-bottom: 20px;
            background: rgba(30, 30, 36, 0.4);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .reader-container {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            line-height: 1.6;
            color: #e4e4e9;
            max-height: 50vh;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Список аудио глав */
        .tracks-list h4 { margin-bottom: 12px; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .track-item {
            background-color: rgba(30, 30, 36, 0.5);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .track-item.active { border-color: var(--accent-color); color: var(--accent-color); background-color: rgba(255, 204, 0, 0.05); }
        .track-name { font-size: 14px; font-weight: 500; }

        /* Фиксированный нижний плеер */
        .mini-player {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: rgba(30, 30, 36, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
            display: none;
            z-index: 100;
        }
        .mini-player.active { display: block; }
        .player-upper { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .player-meta { flex: 1; min-width: 0; padding-right: 12px; }
        .player-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-track-name { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-controls { display: flex; align-items: center; gap: 16px; }
        
        .btn-play {
            background-color: #ffffff;
            color: black;
            border: none;
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer; font-weight: bold;
        }

        .player-lower { display: flex; align-items: center; gap: 10px; }
        .time-label { font-size: 11px; color: var(--text-muted); min-width: 35px; }
        .progress-bar-container { flex: 1; height: 4px; background-color: var(--border-color); border-radius: 2px; position: relative; cursor: pointer; }
        .progress-bar { height: 100%; background-color: #ffffff; width: 0%; border-radius: 2px; }

        .loader { text-align: center; padding: 30px; color: var(--text-muted); display: none; }
    </style>
</head>
<body>

    <div class="blur-background" id="dynamic-blur-bg"></div>

    <header>
        <h1 id="app-title">Яндекс.Книги</h1>
        <button class="btn-settings" id="btn-toggle-settings">⚙️</button>
    </header>

    <main>
        <!-- Настройки -->
        <div id="settings-block" class="auth-card">
            <h3 style="margin-bottom:8px;">Настройка Яндекс.Диска</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">
                Приложение сканирует директорию: <strong style="color:var(--accent-color)">01. Медиатека/книги/</strong>
            </p>
            <div class="input-group">
                <input type="text" id="oauth-token" placeholder="Введите Ваш OAuth токен">
                <button class="btn" id="btn-save-token">Войти</button>
            </div>
        </div>

        <div id="loader" class="loader">Получение списка книг...</div>

        <!-- Экран 1: Витрина -->
        <div id="screen-catalog" class="screen active">
            <h2 style="font-size:20px; margin-bottom:16px;">Моя полка</h2>
            <div class="books-grid" id="books-container"></div>
        </div>

        <!-- Экран 2: Карточка книги (по референсу) -->
        <div id="screen-book-details" class="screen">
            <div class="back-nav" id="btn-back-to-catalog">✕ Закрыть</div>
            
            <div class="book-detail-header">
                <img id="detail-cover-img" class="detail-cover" src="" alt="Обложка">
                <div id="detail-title" class="detail-title">Название книги</div>
                <div id="detail-author" class="detail-author">Автор книги</div>
            </div>

            <!-- Скругленный спаренный переключатель из скриншота -->
            <div class="mode-container-wrapper">
                <div class="mode-switcher-combined">
                    <button class="mode-btn-combined active" id="btn-mode-read">Читать</button>
                    <div class="mode-separator"></div>
                    <button class="mode-btn-combined" id="btn-mode-listen">Слушать</button>
                </div>
            </div>
            
            <!-- Вкладка текста -->
            <div id="content-read" class="mode-content active">
                <div class="detail-desc" id="detail-description">Описание книги...</div>
                <div class="reader-container" id="book-text-reader">Загрузка текста...</div>
            </div>

            <!-- Вкладка аудио -->
            <div id="content-listen" class="mode-content">
                <div class="tracks-list">
                    <h4>Главы аудиокниги</h4>
                    <div id="tracks-container"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Фиксированный нижний плеер -->
    <div class="mini-player" id="audio-player-ui">
        <div class="player-upper">
            <div class="player-meta">
                <div class="player-title" id="player-book-title">Название книги</div>
                <div class="player-track-name" id="player-track-title">Глава 1</div>
            </div>
            <div class="player-controls">
                <button id="btn-player-rw" style="background:none; border:none; color:white; font-size:14px; cursor:pointer;">⏪ 15с</button>
                <button class="btn-play" id="btn-player-toggle">▶</button>
                <button id="btn-player-ff" style="background:none; border:none; color:white; font-size:14px; cursor:pointer;">15с ⏩</button>
            </div>
        </div>
        <div class="player-lower">
            <span class="time-label" id="time-current">00:00</span>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="player-progress"></div>
            </div>
            <span class="time-label" id="time-duration">00:00</span>
        </div>
    </div>

    <audio id="native-audio" preload="auto"></audio>

    <script>
        const API_URL = 'https://cloud-api.yandex.net/v1/disk/resources';
        // Путь изменен под вашу структуру файлов
        const BASE_PATH = '01. Медиатека/книги';
        
        let token = localStorage.getItem('yd_audiobooks_token') || '';
        let state = { books: [], currentBook: null, currentTrackIndex: -1, isPlaying: false };

        const elTokenInput = document.getElementById('oauth-token');
        const elSaveTokenBtn = document.getElementById('btn-save-token');
        const elSettingsBlock = document.getElementById('settings-block');
        const elToggleSettingsBtn = document.getElementById('btn-toggle-settings');
        const elLoader = document.getElementById('loader');
        const elCatalogScreen = document.getElementById('screen-catalog');
        const elDetailsScreen = document.getElementById('screen-book-details');
        const elBooksContainer = document.getElementById('books-container');
        const elBackBtn = document.getElementById('btn-back-to-catalog');
        const elDetailCover = document.getElementById('detail-cover-img');
        const elDetailTitle = document.getElementById('detail-title');
        const elDetailAuthor = document.getElementById('detail-author');
        const elDetailDesc = document.getElementById('detail-description');
        const elTracksContainer = document.getElementById('tracks-container');
        const elTextReader = document.getElementById('book-text-reader');
        const elBlurBg = document.getElementById('dynamic-blur-bg');

        const elBtnModeRead = document.getElementById('btn-mode-read');
        const elBtnModeListen = document.getElementById('btn-mode-listen');
        const elContentRead = document.getElementById('content-read');
        const elContentListen = document.getElementById('content-listen');

        const elPlayerUI = document.getElementById('audio-player-ui');
        const elNativeAudio = document.getElementById('native-audio');
        const elPlayerToggleBtn = document.getElementById('btn-player-toggle');
        const elPlayerBookTitle = document.getElementById('player-book-title');
        const elPlayerTrackTitle = document.getElementById('player-track-title');
        const elTimeCurrent = document.getElementById('time-current');
        const elTimeDuration = document.getElementById('time-duration');
        const elProgressContainer = document.getElementById('progress-container');
        const elProgressBar = document.getElementById('player-progress');

        if (token) {
            elTokenInput.value = token;
            elSettingsBlock.style.display = 'none';
            loadCatalog();
        }

        elSaveTokenBtn.addEventListener('click', () => {
            token = elTokenInput.value.trim();
            if (token) {
                localStorage.setItem('yd_audiobooks_token', token);
                elSettingsBlock.style.display = 'none';
                loadCatalog();
            }
        });

        elToggleSettingsBtn.addEventListener('click', () => {
            elSettingsBlock.style.display = elSettingsBlock.style.display === 'none' ? 'block' : 'none';
        });

        elBackBtn.addEventListener('click', () => {
            elDetailsScreen.classList.remove('active');
            document.body.classList.remove('detail-active');
            elCatalogScreen.classList.add('active');
        });

        elBtnModeRead.addEventListener('click', () => {
            elBtnModeRead.classList.add('active');
            elBtnModeListen.classList.remove('active');
            elContentRead.classList.add('active');
            elContentListen.classList.remove('active');
        });

        elBtnModeListen.addEventListener('click', () => {
            elBtnModeListen.classList.add('active');
            elBtnModeRead.classList.remove('active');
            elContentListen.classList.add('active');
            elContentRead.classList.remove('active');
        });

        async function loadCatalog() {
            if (!token) return;
            showLoader(true);
            try {
                const res = await fetch(`${API_URL}?path=${encodeURIComponent(BASE_PATH)}&limit=100`, {
                    headers: { 'Authorization': `OAuth ${token}` }
                });
                if (!res.ok) throw new Error('Ошибка чтения папки Медиатеки. Проверьте токен.');
                
                const data = await res.json();
                const folders = data._embedded.items.filter(item => item.type === 'dir');
                state.books = [];
                
                for (let folder of folders) {
                    let bookData = {
                        name: folder.name, path: folder.path, title: folder.name,
                        author: 'Неизвестный автор', description: 'Описание отсутствует.',
                        textBookContent: 'Файл book.txt не найден в папке книги.', coverUrl: '', tracks: []
                    };

                    try {
                        const folderRes = await fetch(`${API_URL}?path=${encodeURIComponent(folder.path)}&limit=100`, {
                            headers: { 'Authorization': `OAuth ${token}` }
                        });
                        const folderData = await folderRes.json();
                        const files = folderData._embedded.items;

                        const infoFile = files.find(f => f.name.toLowerCase() === 'info.json');
                        const coverFile = files.find(f => f.name.toLowerCase() === 'cover.jpg' || f.name.toLowerCase() === 'cover.png');
                        const textFile = files.find(f => f.name.toLowerCase() === 'book.txt');
                        
                        bookData.tracks = files
                            .filter(f => f.name.toLowerCase().endsWith('.mp3'))
                            .sort((a, b) => a.name.localeCompare(b.name))
                            .map(f => ({ name: f.name.replace('.mp3', ''), path: f.path }));

                        if (infoFile) {
                            const dRes = await fetch(`${API_URL}/download?path=${encodeURIComponent(infoFile.path)}`, { headers: { 'Authorization': `OAuth ${token}` } });
                            const dData = await dRes.json();
                            const meta = await (await fetch(dData.href)).json();
                            if (meta.title) bookData.title = meta.title;
                            if (meta.author) bookData.author = meta.author;
                            if (meta.description) bookData.description = meta.description;
                        }

                        if (textFile) {
                            const dRes = await fetch(`${API_URL}/download?path=${encodeURIComponent(textFile.path)}`, { headers: { 'Authorization': `OAuth ${token}` } });
                            const dData = await dRes.json();
                            bookData.textBookContent = await (await fetch(dData.href)).text();
                        }

                        if (coverFile) {
                            const dRes = await fetch(`${API_URL}/download?path=${encodeURIComponent(coverFile.path)}`, { headers: { 'Authorization': `OAuth ${token}` } });
                            const dData = await dRes.json();
                            bookData.coverUrl = dData.href;
                        }
                    } catch (e) { console.error('Ошибка разбора книги:', folder.name, e); }
                    state.books.push(bookData);
                }
                renderCatalog();
            } catch (err) { alert(err.message); } finally { showLoader(false); }
        }

        function showLoader(show) { elLoader.style.display = show ? 'block' : 'none'; }

        function renderCatalog() {
            elBooksContainer.innerHTML = '';
            if (state.books.length === 0) {
                elBooksContainer.innerHTML = '<p style="color: var(--text-muted); padding:10px;">Папка книг пуста.</p>';
                return;
            }
            state.books.forEach((book, index) => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="cover-wrapper">
                        ${book.coverUrl ? `<img class="cover-img" src="${book.coverUrl}" alt="Обложка">` : `<div class="cover-placeholder">📖<br>${book.title}</div>`}
                    </div>
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">${book.author}</div>
                    </div>
                `;
                card.addEventListener('click', () => openBookDetails(index));
                elBooksContainer.appendChild(card);
            });
        }

        function openBookDetails(index) {
            const book = state.books[index];
            state.currentBook = book;

            elDetailTitle.innerText = book.title;
            elDetailAuthor.innerText = book.author;
            elDetailDesc.innerText = book.description;
            elTextReader.innerText = book.textBookContent;
            
            if (book.coverUrl) {
                elDetailCover.src = book.coverUrl;
                elDetailCover.style.display = 'block';
                elBlurBg.style.backgroundImage = `url('${book.coverUrl}')`;
            } else {
                elDetailCover.style.display = 'none';
                elBlurBg.style.backgroundImage = 'none';
            }

            elTracksContainer.innerHTML = '';
            book.tracks.forEach((track, tIndex) => {
                const item = document.createElement('div');
                item.className = 'track-item';
                if (state.currentBook === book && state.currentTrackIndex === tIndex) item.classList.add('active');
                item.innerHTML = `<span class="track-name">${tIndex + 1}. ${track.name}</span><span>🎧</span>`;
                item.addEventListener('click', () => playTrack(tIndex));
                elTracksContainer.appendChild(item);
            });

            elBtnModeRead.click();
            elCatalogScreen.classList.remove('active');
            document.body.classList.add('detail-active');
            elDetailsScreen.classList.add('active');
        }

        async function playTrack(trackIndex) {
            state.currentTrackIndex = trackIndex;
            const track = state.currentBook.tracks[trackIndex];
            elPlayerBookTitle.innerText = state.currentBook.title;
            elPlayerTrackTitle.innerText = track.name;
            elPlayerUI.classList.add('active');

            document.querySelectorAll('.track-item').forEach((el, idx) => {
                if (idx === trackIndex) el.classList.add('active');
                else el.classList.remove('active');
            });

            try {
                const res = await fetch(`${API_URL}/download?path=${encodeURIComponent(track.path)}`, { headers: { 'Authorization': `OAuth ${token}` } });
                const data = await res.json();
                elNativeAudio.src = data.href;
                elNativeAudio.play();
                state.isPlaying = true;
                elPlayerToggleBtn.innerText = '⏸';
            } catch (err) { alert('Не удалось загрузить аудиофайл.'); }
        }

        elPlayerToggleBtn.addEventListener('click', () => {
            if (!elNativeAudio.src) return;
            if (state.isPlaying) {
                elNativeAudio.pause(); state.isPlaying = false; elPlayerToggleBtn.innerText = '▶';
            } else {
                elNativeAudio.play(); state.isPlaying = true; elPlayerToggleBtn.innerText = '⏸';
            }
        });

        elNativeAudio.addEventListener('timeupdate', () => {
            const current = elNativeAudio.currentTime;
            const duration = elNativeAudio.duration || 0;
            elTimeCurrent.innerText = formatTime(current);
            elTimeDuration.innerText = formatTime(duration);
            if (duration > 0) elProgressBar.style.width = `${(current / duration) * 100}%`;
        });

        elNativeAudio.addEventListener('ended', () => {
            if (state.currentBook && state.currentTrackIndex + 1 < state.currentBook.tracks.length) {
                playTrack(state.currentTrackIndex + 1);
            } else {
                state.isPlaying = false; elPlayerToggleBtn.innerText = '▶';
            }
        });

        document.getElementById('btn-player-rw').addEventListener('click', () => { elNativeAudio.currentTime = Math.max(0, elNativeAudio.currentTime - 15); });
        document.getElementById('btn-player-ff').addEventListener('click', () => { elNativeAudio.currentTime = Math.min(elNativeAudio.duration || 0, elNativeAudio.currentTime + 15); });

        elProgressContainer.addEventListener('click', (e) => {
            const rect = elProgressContainer.getBoundingClientRect();
            const duration = elNativeAudio.duration || 0;
            if (duration > 0) elNativeAudio.currentTime = ((e.clientX - rect.left) / rect.width) * duration;
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60); const s = Math.floor(secs % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
