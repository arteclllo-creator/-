<!DOCTYPE html>
<html lang="ru" class="h-full bg-neutral-950 text-neutral-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Яндекс Медиатека V2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Оптимизация интерфейса под мобильные WebView */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #171717; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 2px; }
        body { font-family: 'Arial', sans-serif; line-height: 1.25; -webkit-tap-highlight-color: transparent; }
        .blur-bg { background-position: center; background-size: cover; filter: blur(30px); transform: scale(1.1); }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden select-none">

    <div id="loading" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center space-y-4">
        <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs font-semibold text-neutral-400 tracking-wide">Синхронизация с Яндекс Диском...</p>
    </div>

    <div id="auth-screen" class="hidden h-full flex flex-col items-center justify-center p-6 bg-gradient-to-b from-neutral-900 to-neutral-950">
        <div class="w-full max-w-sm bg-neutral-900/50 border border-neutral-800 rounded-2xl p-6 text-center shadow-2xl backdrop-blur-md">
            <div class="w-14 h-14 bg-amber-500/10 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold text-xl">Y</div>
            <h1 class="text-xl font-black mb-2 text-neutral-500 tracking-tight">Яндекс Книги <span class="text-amber-500">Cloud</span></h1>
            <p class="text-xs text-neutral-400 mb-6">Введите ваш OAuth-токен Яндекс Диска для подключения персональной медиатеки</p>
            <input type="password" id="token-input" placeholder="Введите OAuth-токен" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-center focus:outline-none focus:border-amber-500 text-white mb-4 transition">
            <button onclick="saveToken()" class="w-full bg-amber-500 text-neutral-950 text-sm font-bold py-3 rounded-xl hover:bg-amber-400 transition shadow-lg shadow-amber-500/10 cursor-pointer">Войти в медиатеку</button>
        </div>
    </div>

    <div id="main-screen" class="hidden h-full flex flex-col overflow-hidden">
        <header class="flex items-center justify-between px-4 py-4 border-b border-neutral-900 bg-neutral-950/80 backdrop-blur">
            <h1 class="text-lg font-black tracking-tight text-neutral-100">Моя Медиатека</h1>
            <button onclick="logout()" class="text-xs font-bold text-neutral-500 hover:text-rose-400 transition bg-neutral-900 px-3 py-1.5 rounded-full border border-neutral-800 cursor-pointer">Выйти</button>
        </header>
        <main class="flex-1 overflow-y-auto p-4">
            <div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                </div>
        </main>
    </div>

    <div id="book-screen" class="hidden h-full flex flex-col relative overflow-hidden bg-neutral-950">
        <div id="blur-bg" class="blur-bg absolute inset-0 opacity-20 pointer-events-none z-0"></div>

        <header class="relative z-10 flex items-center px-4 py-3 border-b border-neutral-900/30">
            <button onclick="goBack()" class="p-2 text-neutral-400 hover:text-white transition cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex-1 text-center font-bold text-xs text-neutral-400 uppercase tracking-widest px-8 truncate" id="player-header-title">Плеер</div>
            <div class="w-10"></div>
        </header>

        <div class="relative z-10 bg-neutral-900/60 border border-neutral-800/40 rounded-full p-0.5 flex w-44 mx-auto my-3 shadow-inner backdrop-blur-sm">
            <button id="toggle-audio-btn" onclick="setViewMode('audio')" class="flex-1 text-center py-1.5 rounded-full text-xs font-bold transition duration-200 cursor-pointer">Аудио</button>
            <button id="toggle-text-btn" onclick="setViewMode('text')" class="flex-1 text-center py-1.5 rounded-full text-xs font-bold transition duration-200 cursor-pointer">Текст</button>
        </div>

        <div class="flex-1 overflow-y-auto relative z-10 px-4 pb-6 flex flex-col">
            
            <div id="audio-panel" class="flex-1 flex flex-col justify-between space-y-4">
                <div class="flex-col items-center text-center mt-2 flex-1 flex justify-center">
                    <div class="w-48 max-w-[50vw] aspect-[3/4] bg-neutral-900 rounded-2xl overflow-hidden shadow-2xl border border-neutral-800 mb-4 transform scale-100 transition duration-300">
                        <img id="player-cover" src="" class="w-full h-full object-cover" alt="Обложка">
                    </div>
                    <h2 id="player-title" class="font-black text-base text-neutral-100 px-4 line-clamp-1 tracking-tight">Название книги</h2>
                    <p id="player-author" class="text-xs text-amber-500 font-medium mt-1 line-clamp-1">Автор книги</p>
                </div>

                <div class="bg-neutral-900/40 border border-neutral-900/50 rounded-2xl p-4 backdrop-blur-md">
                    <div class="space-y-1">
                        <input type="range" id="progress-slider" min="0" value="0" step="1" class="w-full accent-amber-500 h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-[10px] text-neutral-400 font-mono">
                            <span id="time-current">00:00</span>
                            <span id="time-duration">00:00</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-3 px-2">
                        <button onclick="toggleSpeed()" class="px-2.5 py-1 bg-neutral-800/80 rounded-full text-[11px] font-black hover:bg-neutral-700 transition flex items-center space-x-1 text-amber-500 border border-neutral-700/50 cursor-pointer min-w-[56px] justify-center">
                            <span id="speed-btn-text">1.0x</span>
                        </button>

                        <div class="flex items-center space-x-3">
                            <button onclick="skipBackward()" class="p-2 text-neutral-400 hover:text-white transition cursor-pointer flex flex-col items-center focus:outline-none" title="-15 секунд">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z" />
                                </svg>
                                <span class="text-[9px] font-bold text-neutral-500 mt-0.5">15с</span>
                            </button>

                            <button onclick="togglePlay()" class="w-12 h-12 bg-amber-500 hover:bg-amber-400 text-neutral-950 rounded-full flex items-center justify-center shadow-lg transition transform active:scale-95 cursor-pointer">
                                <svg id="play-btn-icon" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </button>

                            <button onclick="skipForward()" class="p-2 text-neutral-400 hover:text-white transition cursor-pointer flex flex-col items-center focus:outline-none" title="+30 секунд">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.934 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 005 8v8a1 1 0 001.6.8l5.334-4z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.934 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.334-4z" />
                                </svg>
                                <span class="text-[9px] font-bold text-neutral-500 mt-0.5">30с</span>
                            </button>
                        </div>

                        <div class="w-[56px]"></div>
                    </div>
                </div>

                <div class="flex-1 min-h-[140px] bg-neutral-900/20 border border-neutral-900/40 rounded-2xl p-2 overflow-y-auto max-h-48">
                    <div id="playlist" class="space-y-1">
                        </div>
                </div>
            </div>

            <div id="text-panel" class="hidden flex-1 bg-neutral-900/30 border border-neutral-900/50 rounded-2xl p-4 overflow-y-auto max-h-[70vh]">
                <div id="text-content" class="text-sm text-neutral-300 leading-relaxed space-y-4 whitespace-pre-line font-serif select-text">
                    </div>
            </div>

        </div>
    </div>

    <audio id="audio-element" class="hidden"></audio>

    <script>
        const API_BASE = 'https://cloud-api.yandex.net/v1/disk/resources';
        const speeds = [1.0, 1.25, 1.5, 1.75, 2.0];
        
        window.currentTracks = [];
        window.currentTrackIndex = 0;
        window.currentPlaybackSpeed = 1.0;
        window.isDraggingSlider = false;

        // Элементы плеера
        const audio = document.getElementById('audio-element');
        const slider = document.getElementById('progress-slider');
        const currentTimeEl = document.getElementById('time-current');
        const durationTimeEl = document.getElementById('time-duration');
        const playBtnIcon = document.getElementById('play-btn-icon');

        // Инициализация при старте
        window.onload = function() {
            initAudioEventListeners();
            const token = localStorage.getItem('yd_token');
            if (token) {
                switchView('main-screen');
                loadBooks();
            } else {
                switchView('auth-screen');
            }
        };

        function switchView(viewId) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('book-screen').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        // Авторизация
        function saveToken() {
            const token = document.getElementById('token-input').value.trim();
            if (token) {
                localStorage.setItem('yd_token', token);
                switchView('main-screen');
                loadBooks();
            } else {
                alert('Пожалуйста, введите корректный токен.');
            }
        }

        function logout() {
            if(confirm('Вы уверены, что хотите выйти из аккаунта?')) {
                audio.pause();
                localStorage.removeItem('yd_token');
                localStorage.removeItem('books_cache');
                switchView('auth-screen');
            }
        }

        // Взаимодействие с API Яндекс Диска
        async function fetchFromDisk(path) {
            const token = localStorage.getItem('yd_token');
            if (!token) {
                switchView('auth-screen');
                throw new Error('Токен отсутствует');
            }
            
            const encodedPath = encodeURIComponent(path);
            const url = `${API_BASE}?path=${encodedPath}&limit=100`;
            
            const response = await fetch(url, {
                headers: { 'Authorization': `OAuth ${token}` }
            });
            
            if (response.status === 401) {
                localStorage.removeItem('yd_token');
                switchView('auth-screen');
                throw new Error('Неавторизован. Токен сброшен.');
            }
            if (!response.ok) {
                throw new Error(`Ошибка диска: ${response.status}`);
            }
            return await response.json();
        }

        // Загрузка главной полки
        async function loadBooks() {
            showLoading(true);
            // Новая структура: папка Книги с заглавной буквы
            const path = '01. Медиатека/Книги';
            try {
                const data = await fetchFromDisk(path);
                const items = data._embedded?.items || [];
                const folders = items.filter(item => item.type === 'dir');
                
                const grid = document.getElementById('books-grid');
                grid.innerHTML = '';
                
                if (folders.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-neutral-500 py-12 text-xs">Папка "01. Медиатека/Книги" пуста</div>';
                    return;
                }
                
                const cache = JSON.parse(localStorage.getItem('books_cache') || '{}');
                
                folders.forEach(folder => {
                    const cached = cache[folder.name];
                    const card = document.createElement('div');
                    card.className = 'bg-neutral-900/60 border border-neutral-900 rounded-xl p-2.5 flex flex-col cursor-pointer hover:bg-neutral-800/80 transition active:scale-95 duration-150';
                    card.onclick = () => openBook(folder.name);
                    
                    const coverContainer = document.createElement('div');
                    coverContainer.className = 'aspect-[3/4] w-full bg-neutral-800 rounded-lg overflow-hidden mb-2 relative shadow-md';
                    
                    const img = document.createElement('img');
                    img.className = 'w-full h-full object-cover opacity-0 transition-opacity duration-300';
                    coverContainer.appendChild(img);
                    
                    const title = document.createElement('h3');
                    title.className = 'font-bold text-xs text-neutral-200 line-clamp-1 tracking-tight';
                    title.textContent = cached?.title || folder.name;
                    
                    const author = document.createElement('p');
                    author.className = 'text-[10px] text-neutral-400 line-clamp-1 mt-0.5';
                    author.textContent = cached?.author || 'Синхронизация...';
                    
                    card.appendChild(coverContainer);
                    card.appendChild(title);
                    card.appendChild(author);
                    grid.appendChild(card);
                    
                    if (cached && cached.coverUrl) {
                        img.src = cached.coverUrl;
                        img.classList.remove('opacity-0');
                        author.textContent = cached.author;
                    } else {
                        lazyLoadBookDetails(folder.name, img, author, title);
                    }
                });
            } catch (err) {
                console.error(err);
                alert('Не удалось загрузить Книги. Убедитесь в наличии папки "01. Медиатека/Книги" на Диске.');
            } finally {
                showLoading(false);
            }
        }

        // Фоновая подгрузка данных карточки
        async function lazyLoadBookDetails(folderName, imgEl, authorEl, titleEl) {
            const path = `01. Медиатека/Книги/${folderName}`;
            try {
                const data = await fetchFromDisk(path);
                const items = data._embedded?.items || [];
                
                let coverUrl = 'https://via.placeholder.com/150x200?text=Нет+обложки';
                let title = folderName;
                let author = 'Автор неизвестен';
                let description = '';
                
                const cover = items.find(i => i.type === 'file' && (i.name.toLowerCase() === 'cover.jpg' || i.name.toLowerCase() === 'cover.png'));
                if (cover) coverUrl = cover.file;
                
                const infoFile = items.find(i => i.type === 'file' && i.name.toLowerCase() === 'info.json');
                if (infoFile) {
                    try {
                        const res = await fetch(infoFile.file);
                        const info = await res.json();
                        title = info.title || title;
                        author = info.author || author;
                        description = info.description || '';
                    } catch (e) { console.error('Ошибка чтения info.json', e); }
                }
                
                imgEl.src = coverUrl;
                imgEl.classList.remove('opacity-0');
                titleEl.textContent = title;
                authorEl.textContent = author;
                
                const cache = JSON.parse(localStorage.getItem('books_cache') || '{}');
                cache[folderName] = { title, author, coverUrl, description };
                localStorage.setItem('books_cache', JSON.stringify(cache));
            } catch (e) { console.error(e); }
        }

        // Открытие конкретной книги
        async function openBook(folderName) {
            showLoading(true);
            const bookPath = `01. Медиатека/Книги/${folderName}`;
            // Новая логика: аудио хранится строго во вложенной папке "Аудиокнига"
            const audioPath = `01. Медиатека/Книги/${folderName}/Аудиокнига`;
            
            try {
                const cache = JSON.parse(localStorage.getItem('books_cache') || '{}');
                const meta = cache[folderName];
                
                let textContent = meta?.description || "Текст или описание книги отсутствуют.";
                
                // Чтение book.txt из корня папки книги
                try {
                    const rootFolder = await fetchFromDisk(bookPath);
                    const rootItems = rootFolder._embedded?.items || [];
                    const txtFile = rootItems.find(i => i.type === 'file' && i.name.toLowerCase() === 'book.txt');
                    if (txtFile) {
                        const txtRes = await fetch(txtFile.file);
                        textContent = await txtRes.text();
                    }
                } catch(e) { console.log('Файл book.txt отсутствует, используется описание'); }

                // Загрузка треков из целевой подпапки Аудиокнига
                let tracks = [];
                try {
                    const audioFolder = await fetchFromDisk(audioPath);
                    const audioItems = audioFolder._embedded?.items || [];
                    tracks = audioItems
                        .filter(i => i.type === 'file' && i.name.toLowerCase().endsWith('.mp3'))
                        .sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
                } catch (e) { console.error('Папка "Аудиокнига" не найдена или пуста', e); }

                // Настройка UI плеера
                document.getElementById('player-title').textContent = meta?.title || folderName;
                document.getElementById('player-author').textContent = meta?.author || 'Автор не указан';
                document.getElementById('player-header-title').textContent = meta?.title || 'Плеер';
                
                const coverUrl = meta?.coverUrl || 'https://via.placeholder.com/300x400?text=Нет+обложки';
                document.getElementById('player-cover').src = coverUrl;
                document.getElementById('blur-bg').style.backgroundImage = `url('${coverUrl}')`;
                document.getElementById('text-content').textContent = textContent;

                window.currentTracks = tracks;
                window.currentTrackIndex = 0;

                // Генерация плейлиста
                const playlist = document.getElementById('playlist');
                playlist.innerHTML = '';

                if (tracks.length === 0) {
                    playlist.innerHTML = '<p class="text-neutral-500 text-[11px] text-center py-4">В папке "Аудиокнига" нет файлов .mp3</p>';
                } else {
                    tracks.forEach((track, index) => {
                        const item = document.createElement('div');
                        item.className = `p-2.5 rounded-xl cursor-pointer text-xs transition flex justify-between items-center ${index === 0 ? 'bg-amber-500/10 text-amber-500 font-bold' : 'hover:bg-neutral-900/60 text-neutral-400'}`;
                        item.id = `track-${index}`;
                        item.onclick = () => selectTrack(index);
                        
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'truncate pr-4';
                        nameSpan.textContent = track.name.replace('.mp3', '');
                        
                        item.appendChild(nameSpan);
                        playlist.appendChild(item);
                    });
                    loadTrack(0, false);
                }

                setViewMode('audio');
                switchView('book-screen');
            } catch (err) {
                console.error(err);
                alert('Ошибка инициализации книги. Проверьте структуру папок.');
            } finally {
                showLoading(false);
            }
        }

        // Логика аудио-движка
        function loadTrack(index, autoplay = true) {
            if (!window.currentTracks || window.currentTracks.length === 0) return;
            
            // Сброс старого стиля трека в списке
            const prevRow = document.getElementById(`track-${window.currentTrackIndex}`);
            if (prevRow) {
                prevRow.className = 'p-2.5 rounded-xl cursor-pointer text-xs transition flex justify-between items-center hover:bg-neutral-900/60 text-neutral-400';
            }

            window.currentTrackIndex = index;
            
            // Активация нового стиля
            const newRow = document.getElementById(`track-${index}`);
            if (newRow) {
                newRow.className = 'p-2.5 rounded-xl cursor-pointer text-xs transition flex justify-between items-center bg-amber-500/10 text-amber-500 font-bold';
                newRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            audio.src = window.currentTracks[index].file;
            // Применяем текущую скорость чтения принудительно для нового трека
            audio.playbackRate = window.currentPlaybackSpeed;

            if (autoplay) {
                audio.play()
                    .then(() => updatePlayButton(true))
                    .catch(e => console.log('Ошибка воспроизведения:', e));
            } else {
                updatePlayButton(false);
            }
        }

        function selectTrack(index) {
            loadTrack(index, true);
        }

        function togglePlay() {
            if (window.currentTracks.length === 0) return;
            if (audio.paused) {
                audio.play().then(() => updatePlayButton(true));
            } else {
                audio.pause();
                updatePlayButton(false);
            }
        }

        function updatePlayButton(isPlaying) {
            if (isPlaying) {
                playBtnIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`; // Иконка паузы
            } else {
                playBtnIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`; // Иконка плей
            }
        }

        // НОВЫЙ ФУНКЦИОНАЛ: Перемотка назад на 15 секунд
        function skipBackward() {
            if (!audio.src) return;
            audio.currentTime = Math.max(0, audio.currentTime - 15);
        }

        // НОВЫЙ ФУНКЦИОНАЛ: Перемотка вперед на 30 секунд
        function skipForward() {
            if (!audio.src) return;
            audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30);
        }

        // НОВЫЙ ФУНКЦИОНАЛ: Изменение скорости воспроизведения
        function toggleSpeed() {
            let currentIndex = speeds.indexOf(window.currentPlaybackSpeed);
            let nextIndex = (currentIndex + 1) % speeds.length;
            window.currentPlaybackSpeed = speeds[nextIndex];
            
            // Визуальное обновление кнопки
            document.getElementById('speed-btn-text').textContent = `${window.currentPlaybackSpeed.toFixed(1)}x`;
            
            // Назначение новой скорости плееру
            audio.playbackRate = window.currentPlaybackSpeed;
        }

        // Слушатели событий тега audio
        function initAudioEventListeners() {
            audio.ontimeupdate = () => {
                if (!window.isDraggingSlider) {
                    slider.value = audio.currentTime;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            };

            audio.onloadedmetadata = () => {
                slider.max = audio.duration || 0;
                slider.value = audio.currentTime;
                durationTimeEl.textContent = formatTime(audio.duration);
                // Поддерживаем выбранный темп
                audio.playbackRate = window.currentPlaybackSpeed;
            };

            audio.onended = () => {
                // Автоматический запуск следующей главы
                if (window.currentTrackIndex < window.currentTracks.length - 1) {
                    loadTrack(window.currentTrackIndex + 1, true);
                } else {
                    updatePlayButton(false);
                }
            };

            // Логика перемещения ползунка пользователем
            slider.oninput = () => {
                window.isDraggingSlider = true;
                currentTimeEl.textContent = formatTime(slider.value);
            };

            slider.onchange = () => {
                audio.currentTime = slider.value;
                window.isDraggingSlider = false;
            };
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Переключение режимов отображения "Текст / Аудио"
        function setViewMode(mode) {
            const audioBtn = document.getElementById('toggle-audio-btn');
            const textBtn = document.getElementById('toggle-text-btn');
            const audioPanel = document.getElementById('audio-panel');
            const textPanel = document.getElementById('text-panel');
            
            const activeStyle = "flex-1 text-center py-1.5 rounded-full text-xs font-bold transition duration-200 bg-amber-500 text-neutral-950 shadow shadow-amber-500/20";
            const inactiveStyle = "flex-1 text-center py-1.5 rounded-full text-xs font-bold transition duration-200 text-neutral-400 hover:text-neutral-200";

            if (mode === 'audio') {
                audioBtn.className = activeStyle;
                textBtn.className = inactiveStyle;
                audioPanel.classList.remove('hidden');
                textPanel.classList.add('hidden');
            } else {
                textBtn.className = activeStyle;
                audioBtn.className = inactiveStyle;
                audioPanel.classList.add('hidden');
                textPanel.classList.remove('hidden');
            }
        }

        function goBack() {
            switchView('main-screen');
        }
    </script>
</body>
</html>
