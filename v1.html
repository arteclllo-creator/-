<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Аудиокниги</title>
    <style>
        :root {
            --bg-color: #fcf8f2;
            --primary-color: #f4c430;
            --text-color: #4a3b32;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { margin-bottom: 5px; }
        .token-input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            background-color: var(--primary-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e0b324; }
        .track-list {
            text-align: left;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 8px;
        }
        .track-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .track-item:hover { background-color: #fdf6e2; }
        .player-ui {
            margin-top: 20px;
            display: none;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Яндекс.Облако Книги</h1>
    <p>Локальный веб-плеер для твоего Диска</p>
    
    <div id="auth-section">
        <input type="text" id="oauth-token" class="token-input" placeholder="Вставь свой Яндекс OAuth Токен">
        <br>
        <button onclick="loadBooks()">Подключиться к Диску</button>
    </div>

    <div id="library-section" style="display:none;">
        <h3>Доступные главы:</h3>
        <div id="tracks" class="track-list"></div>
    </div>

    <div id="player-section" class="player-ui">
        <h4 id="current-track-title">Воспроизведение...</h4>
        <audio id="audio-player" controls autocomplete="off"></audio>
        
        <div class="controls">
            <button onclick="changeSpeed(1)">1x</button>
            <button onclick="changeSpeed(1.25)">1.25x</button>
            <button onclick="changeSpeed(1.5)">1.5x</button>
            <button onclick="changeSpeed(2)">2x</button>
        </div>
    </div>
</div>

<script>
    let token = '';
    const folderPath = 'Audiobooks'; // Папка на твоем Яндекс Диске
    const player = document.getElementById('audio-player');
    let currentTrackPath = '';

    // 1. Загрузка списка файлов из Яндекса
    async function loadBooks() {
        token = document.getElementById('oauth-token').value.trim();
        if (!token) return alert('Введите токен!');

        const url = `https://cloud-api.yandex.net/v1/disk/resources?path=${encodeURIComponent(folderPath)}`;
        
        try {
            const response = await fetch(url, {
                headers: { 'Authorization': `OAuth ${token}` }
            });
            if (!response.ok) throw new Error('Ошибка сети или неверный токен');
            
            const data = await response.json();
            const files = data._embedded.items.filter(item => item.mime_type === 'audio/mpeg');
            
            displayTracks(files);
        } catch (err) {
            alert(err.message);
        }
    }

    // 2. Отображение списка треков на экране
    function displayTracks(files) {
        const tracksDiv = document.getElementById('tracks');
        tracksDiv.innerHTML = '';
        
        if(files.length === 0) {
            tracksDiv.innerHTML = '<p>В папке "Audiobooks" не найдено mp3 файлов.</p>';
        }

        files.forEach(file => {
            const item = document.createElement('div');
            item.className = 'track-item';
            item.innerText = file.name;
            item.onclick = () => playTrack(file.name, file.path);
            tracksDiv.appendChild(item);
        });

        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('library-section').style.display = 'block';
    }

    // 3. Запрос ссылки на скачиability и запуск плеера
    async function playTrack(name, path) {
        currentTrackPath = path;
        const url = `https://cloud-api.yandex.net/v1/disk/resources/download?path=${encodeURIComponent(path)}`;
        
        try {
            const response = await fetch(url, { headers: { 'Authorization': `OAuth ${token}` } });
            const data = await response.json();
            
            document.getElementById('current-track-title').innerText = name;
            document.getElementById('player-section').style.style.display = 'block';
            
            player.src = data.href; // Прямая ссылка на mp3 поток
            
            // Восстанавливаем позицию времени для этого файла
            const savedTime = localStorage.getItem(currentTrackPath);
            if (savedTime) {
                player.currentTime = parseFloat(savedTime);
            }
            
            player.play();
        } catch (err) {
            alert('Не удалось запустить трек');
        }
    }

    // 4. Сохранение прогресса в память браузера (LocalStorage)
    player.ontimeupdate = () => {
        if (currentTrackPath) {
            localStorage.setItem(currentTrackPath, player.currentTime);
        }
    };

    // 5. Изменение скорости воспроизведения
    function changeSpeed(speed) {
        player.playbackRate = speed;
    }
</script>

</body>
</html>
