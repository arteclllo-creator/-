<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книги</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #fc3f1d; /* Фирменный кораллово-красный Яндекса */
            --input-bg: #2a2a2a;
            --border-color: #2c2c2e;
            --glass-bg: rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #121212;
            --text-secondary: #666666;
            --accent-color: #fc3f1d;
            --input-bg: #e5e5e7;
            --border-color: #e5e5ea;
            --glass-bg: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
            z-index: 1;
        }

        .screen.hidden {
            display: none !important;
            z-index: 0;
        }

        /* Шапка приложения */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .icon-btn:hover {
            background: var(--input-bg);
        }

        /* Экран авторизации */
        #auth-screen {
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .auth-container h2 { margin-bottom: 12px; }
